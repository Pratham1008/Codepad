<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CodePad - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",

                    "colors": {

                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#251a00",
                        "surface-container-highest": "#ece0dc",

                        "inverse-surface": "#362f2d",
                        "on-error": "#ffffff",
                        "secondary-container": "#fdd677",
                        "primary": "#783100",
                        "outline-variant": "#ddc1b4",
                        "on-surface-variant": "#564339",
                        "secondary-fixed-dim": "#e8c266",
                        "primary-fixed": "#ffdbca",
                        "on-background": "#201a18",
                        "tertiary-fixed": "#ffd9e3",
                        "on-secondary-fixed-variant": "#5a4400",
                        "on-primary-container": "#ffceb6",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#633b48",
                        "surface-container-high": "#f2e5e2",
                        "secondary-fixed": "#ffdf96",
                        "primary-container": "#9d4300",

                        "surface-tint": "#9d4300",

                        "on-secondary-container": "#775b01",
                        "tertiary-fixed-dim": "#eeb8c8",
                        "surface-dim": "#e4d7d4",

                        "inverse-on-surface": "#fbeeea",
                        "surface": "#fff8f6",
                        "surface-container-low": "#fef1ed",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#31111d",
                        "on-secondary": "#ffffff",
                        "secondary": "#765a00",
                        "tertiary": "#633b48",
                        "on-primary": "#ffffff",
                        "background": "#fff8f6",
                        "tertiary-container": "#7d5260",
                        "surface-container": "#f8ebe7",
                        "inverse-primary": "#ffb690"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "sidebar_width": "260px",
                        "lg": "24px",
                        "xl": "32px",
                        "gutter": "1px",
                        "base": "4px",
                        "md": "16px",
                        "xs": "4px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "code-table": ["JetBrains Mono"],
                        "code-body": ["JetBrains Mono"],
                        "body-md": ["Inter"],

                        "label-sm": ["Inter"]
                    },
                    "fontSize": {

                        "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .9; transform: scale(0.98); }
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        
        /* Particle motif simulation */
        .ambient-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,182,144,0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(157,67,0,0.08) 0%, transparent 50%);
            z-index: 0;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased h-screen w-screen overflow-hidden flex selection:bg-primary-container selection:text-on-primary-container class='dark'">
<!-- Left Panel: 60% ambient -->
<div class="hidden lg:flex w-[60%] bg-[#151312] text-white relative flex-col justify-center items-center p-xl ambient-panel overflow-hidden border-r border-outline-variant/10">
<!-- Faint particle simulation -->
<div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(circle at 2px 2px, rgba(255,182,144,0.3) 1px, transparent 0); background-size: 32px 32px;"></div>
<div class="relative z-10 max-w-lg text-center">
<h1 class="font-display-lg text-display-lg font-bold text-transparent bg-clip-text bg-gradient-to-br from-white to-outline-variant/60 animate-fade-in-up">
                Every project deserves clean code.
            </h1>
<p class="mt-lg font-body-md text-body-md text-outline-variant/70 animate-fade-in-up delay-100">
                Orchestrate, build, and deploy with precision.
            </p>
</div>
</div>
<!-- Right Panel: 40% Auth -->
<div class="w-full lg:w-[40%] bg-[#151312] relative flex flex-col items-center justify-center p-md lg:p-xl h-full">
<!-- Theme Toggle -->
<div class="absolute top-md right-md lg:top-lg lg:right-lg z-20">
<button aria-label="Toggle Theme" class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-highest/10 text-outline-variant hover:bg-surface-container-highest/20 transition-colors duration-150 active:scale-[0.97]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">light_mode</span>
</button>
</div>
<!-- Auth Card -->
<div class="w-full max-w-md bg-[#373433] rounded-xl border border-outline-variant/10 shadow-2xl p-xl flex flex-col items-center relative z-10 animate-fade-in-up delay-100">
<!-- Logo -->
<div class="mb-lg w-16 h-16 rounded-lg bg-[#201d1c] flex items-center justify-center border border-outline-variant/5 shadow-inner">
<img alt="CodePad Logo" class="w-10 h-10 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLuL-LWPWb__0YSygr_dMWTPoV44TikG95KTkOYLbK5SQKxpoDS600NSneXw10uU1QIv_cc1qnjFiOEsOHl60XIgAAPvCM7PKA4_WVOqe43qFAuTb_D0eSJhxshSCpiVqNh3hIDOXFqUbFNql8QdxkiKBEj2z2tWwE4nzZB6G5tznX20xM4XstYkWPoH9QEFrBzpbDIeSQKlDPJIJQNjaAUVw24BTdaomhEulscGkQ0wlDwwAvnHG6bduW8"/>
</div>
<!-- Header -->
<div class="text-center mb-xl w-full">
<h2 class="font-headline-sm text-headline-sm font-bold text-white mb-xs">Welcome back</h2>
<p class="font-body-md text-body-md text-outline-variant/80">Sign in to your orchestration environment</p>
</div>
<!-- Actions -->
<div class="w-full space-y-md">
<!-- Primary Passkey Button -->
<button class="w-full h-12 rounded-lg bg-[#FFB690] text-[#341100] font-title-md text-title-md font-bold flex items-center justify-center gap-sm hover:bg-white transition-colors duration-150 active:scale-[0.97] animate-pulse-slow shadow-[0_0_20px_rgba(255,182,144,0.15)] hover:shadow-[0_0_25px_rgba(255,182,144,0.3)]">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
                    Continue with Passkey
                </button>
<!-- Divider -->
<div class="flex items-center gap-md py-sm">
<div class="flex-1 h-px bg-outline-variant/20"></div>
<span class="font-label-sm text-label-sm text-outline-variant/50 uppercase tracking-widest">or</span>
<div class="flex-1 h-px bg-outline-variant/20"></div>
</div>
<!-- Secondary Email Button -->
<button class="w-full h-12 rounded-lg bg-transparent border border-outline-variant/30 text-outline-variant font-title-md text-title-md flex items-center justify-center gap-sm hover:bg-white/5 hover:text-white transition-all duration-150 active:scale-[0.97]">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">mail</span>
                    Continue with Email
                </button>
</div>
<!-- Footer Link -->
<div class="mt-xl text-center w-full">
<a class="font-body-md text-body-md text-[#FFB95F] hover:text-[#ffdbca] transition-colors duration-150 inline-flex items-center gap-xs" href="#">
                    New here? Create an account
                    <span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</a>
</div>
</div>
<!-- Subtle bottom branding -->
<div class="absolute bottom-md text-center w-full opacity-40">
<span class="font-code-table text-code-table text-outline-variant">CodePad IDE v2.4.1</span>
</div>
</div>
</body></html>
