<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CodePad - Create New Project</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#5a4400",
                        "on-tertiary-fixed": "#31111d",
                        "on-primary": "#ffffff",
                        "outline": "#897267",
                        "surface-container-high": "#f2e5e2",
                        "primary-fixed": "#ffdbca",
                        "on-primary-fixed-variant": "#783200",
                        "on-error-container": "#93000a",
                        "on-background": "#201a18",
                        "surface-variant": "#ece0dc",
                        "primary-fixed-dim": "#ffb690",
                        "inverse-primary": "#ffb690",
                        "surface-container-highest": "#ece0dc",
                        "secondary-fixed-dim": "#e8c266",
                        "tertiary-container": "#7d5260",
                        "surface-dim": "#e4d7d4",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#633b48",
                        "surface-bright": "#fff8f6",
                        "on-surface-variant": "#564339",
                        "surface-container": "#f8ebe7",
                        "primary-container": "#9d4300",
                        "surface-container-low": "#fef1ed",
                        "inverse-surface": "#362f2d",
                        "background": "#fff8f6",
                        "on-secondary": "#ffffff",
                        "surface": "#fff8f6",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#ddc1b4",
                        "tertiary": "#633b48",
                        "inverse-on-surface": "#fbeeea",
                        "on-secondary-fixed": "#251a00",
                        "error-container": "#ffdad6",
                        "secondary-container": "#fdd677",
                        "error": "#ba1a1a",
                        "primary": "#783100",
                        "on-secondary-container": "#775b01",
                        "on-primary-container": "#ffceb6",
                        "secondary": "#765a00",
                        "tertiary-fixed": "#ffd9e3",
                        "surface-tint": "#9d4300",
                        "on-primary-fixed": "#341100",
                        "tertiary-fixed-dim": "#eeb8c8",
                        "on-surface": "#201a18",
                        "on-tertiary-container": "#ffcbda",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#ffdf96"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem",
                        "modal": "24px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "sidebar_width": "260px",
                        "gutter": "1px",
                        "lg": "24px",
                        "md": "16px",
                        "xl": "32px",
                        "sm": "8px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "title-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-sm": ["Inter"],
                        "code-table": ["JetBrains Mono"],
                        "code-body": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "title-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "500"}],
                        "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "400"}],
                        "label-sm": ["11px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                        "code-table": ["12px", {"lineHeight": "18px", "fontWeight": "400"}],
                        "code-body": ["14px", {"lineHeight": "22px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background dark:bg-[#1a1514] text-on-background dark:text-[#f4e2db] font-body-md h-screen overflow-hidden flex relative">
<!-- Blurred Background (Dashboard Context) -->
<div class="absolute inset-0 z-0 bg-cover bg-center filter blur-md opacity-40 grayscale" data-alt="A blurred view of a complex software development dashboard interface in a dark terracotta color scheme, conveying depth and a multi-pane environment." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBsjpWNrRCqH5sTguCv2kzQ-QflR_HprWYpoc0ogN4NwRhq6xh7BjYnsBjLCRNmzOrm3Aa4EYL4RxjhlsgCZsuAnqDZonZUgC-Xu6xdVi5AudFC_fGWE6FTdSrsgyXlRPTVYu9VV22g4yIy6Z7IQLlCTUgquRAmA-tR9MIYDdN44PnFTDpPtXo_IjQ7vbEcMBtseclhw4gcDLU_pnS4Wyp6qapyhUzPko8GDH0Fd5Z0CEMw_h-F3UmT')"></div>
<div class="absolute inset-0 z-10 bg-[#1a1514]/70 backdrop-blur-sm"></div>
<!-- Modal Overlay Container -->
<div class="relative z-50 flex items-center justify-center w-full h-full p-4">
<!-- Modal Content -->
<div class="bg-surface-container dark:bg-surface-container-low rounded-modal w-[520px] max-w-full shadow-2xl border border-outline-variant/30 flex flex-col transform transition-transform scale-100">
<!-- Header -->
<div class="flex items-center justify-between p-lg border-b border-outline-variant/20">
<h2 class="font-headline-sm text-headline-sm font-semibold text-on-surface dark:text-[#f4e2db]">Create New Project</h2>
<button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-on-surface/[0.08] dark:hover:bg-on-background/[0.08] transition-colors text-on-surface-variant dark:text-outline active:scale-[0.97] duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Body -->
<div class="p-lg flex flex-col gap-xl">
<!-- Project Name Input -->
<div class="flex flex-col gap-sm">
<label class="font-title-md text-title-md text-on-surface dark:text-[#f4e2db]" for="projectName">Project Name</label>
<input class="w-full bg-surface dark:bg-[#201a18] border border-outline-variant rounded-lg px-md py-3 font-body-md text-body-md text-on-surface dark:text-[#f4e2db] placeholder-on-surface-variant/50 focus:border-primary dark:focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary dark:focus:ring-primary-fixed-dim focus:outline-none transition-all" id="projectName" placeholder="e.g. Student Management System" type="text"/>
</div>
<!-- Language Selection -->
<div class="flex flex-col gap-md">
<span class="font-title-md text-title-md text-on-surface dark:text-[#f4e2db]">Environment</span>
<div class="grid grid-cols-3 gap-md">
<!-- Java (Selected) -->
<div class="flex flex-col items-center justify-center p-md bg-surface dark:bg-[#201a18] border-2 border-primary-fixed-dim rounded-xl cursor-pointer hover:bg-on-surface/[0.04] transition-colors relative">
<div class="absolute top-2 right-2 w-4 h-4 rounded-full bg-primary-fixed-dim flex items-center justify-center">
<span class="material-symbols-outlined text-[#1a1514]" style="font-size: 12px; font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="material-symbols-outlined text-[40px] text-primary-fixed-dim mb-sm" style="font-variation-settings: 'FILL' 0;">coffee</span>
<span class="font-label-sm text-label-sm text-primary-fixed-dim font-bold">Java</span>
</div>
<!-- Python -->
<div class="flex flex-col items-center justify-center p-md bg-surface dark:bg-[#201a18] border border-outline-variant rounded-xl cursor-pointer hover:bg-on-surface/[0.04] transition-colors text-on-surface-variant dark:text-outline hover:text-on-surface dark:hover:text-[#f4e2db] hover:border-outline">
<span class="material-symbols-outlined text-[40px] mb-sm" style="font-variation-settings: 'FILL' 0;">code</span>
<span class="font-label-sm text-label-sm">Python</span>
</div>
<!-- C++ -->
<div class="flex flex-col items-center justify-center p-md bg-surface dark:bg-[#201a18] border border-outline-variant rounded-xl cursor-pointer hover:bg-on-surface/[0.04] transition-colors text-on-surface-variant dark:text-outline hover:text-on-surface dark:hover:text-[#f4e2db] hover:border-outline">
<span class="material-symbols-outlined text-[40px] mb-sm" style="font-variation-settings: 'FILL' 0;">data_object</span>
<span class="font-label-sm text-label-sm">C++</span>
</div>
</div>
</div>
<!-- Preview File Line -->
<div class="flex items-center gap-sm bg-surface-container-high dark:bg-[#261f1d] p-sm rounded-lg border border-outline-variant/30">
<span class="material-symbols-outlined text-outline" style="font-size: 16px;">description</span>
<span class="font-code-body text-code-body text-on-surface-variant dark:text-outline">Entry file: </span>
<span class="font-code-body text-code-body text-primary-fixed-dim">Main.java</span>
</div>
</div>
<!-- Footer -->
<div class="flex items-center justify-end gap-md p-lg border-t border-outline-variant/20 bg-surface dark:bg-[#201a18] rounded-b-[24px]">
<button class="px-md py-2 font-title-md text-title-md text-primary dark:text-primary-fixed-dim hover:bg-primary/[0.08] dark:hover:bg-primary-fixed-dim/[0.08] rounded-lg transition-colors active:scale-[0.97] duration-150">
                    Cancel
                </button>
<button class="px-lg py-2 font-title-md text-title-md bg-primary dark:bg-primary-fixed-dim text-on-primary dark:text-[#341100] rounded-lg hover:bg-primary/90 dark:hover:bg-primary-fixed-dim/90 transition-colors shadow-sm active:scale-[0.97] duration-150">
                    Create Project
                </button>
</div>
</div>
</div>
</body></html>
