<!DOCTYPE html>

<style>
        /* Custom scrollbar for dark mode */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #564339;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7d5260;
        }
        
        /* Dark mode overrides since Tailwind config provided focuses on light tokens */
        .dark body {
            background-color: #151312; /* From prompt */
            color: #ece0dc;
        }
        .dark .bg-surface-container { background-color: #2b2827; }
        .dark .bg-surface-container-high { background-color: #363332; }
        .dark .bg-surface-container-highest { background-color: #433e3d; }
        .dark .border-outline-variant { border-color: #494544; }
        .dark .text-on-surface { color: #ece0dc; }
        .dark .text-on-surface-variant { color: #cac4c2; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden antialiased">
<!-- TopNavBar -->
<nav class="bg-surface dark:bg-[#1f1b1a] border-b border-outline-variant dark:border-[#383230] docked full-width top-0 flat no shadows flex justify-between items-center w-full px-md h-16 shrink-0 z-10">
<div class="flex items-center gap-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">terminal</span>
<span class="font-headline-sm text-headline-sm font-bold text-primary dark:text-primary-fixed-dim tracking-tight">CodePad</span>
</div>
<div class="hidden md:flex ml-8 items-center gap-1">
<button class="px-3 py-2 rounded-md text-on-surface-variant dark:text-surface-variant hover:bg-on-surface/8 dark:hover:bg-surface-variant/8 transition-colors font-title-md text-title-md active:scale-95 duration-150">Editor</button>
<button class="px-3 py-2 rounded-md text-on-surface-variant dark:text-surface-variant hover:bg-on-surface/8 dark:hover:bg-surface-variant/8 transition-colors font-title-md text-title-md active:scale-95 duration-150">Files</button>
<button class="px-3 py-2 rounded-md text-on-surface-variant dark:text-surface-variant hover:bg-on-surface/8 dark:hover:bg-surface-variant/8 transition-colors font-title-md text-title-md active:scale-95 duration-150">Terminal</button>
<button class="px-3 py-2 rounded-md text-primary dark:text-primary-fixed-dim border-b-2 border-primary dark:border-primary-fixed-dim pb-1 bg-on-surface/5 dark:bg-surface-variant/5 transition-colors font-title-md text-title-md active:scale-95 duration-150">Settings</button>
</div>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-2">
<button class="p-2 rounded-full text-on-surface-variant dark:text-surface-variant hover:bg-on-surface/8 dark:hover:bg-surface-variant/8 transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined">account_tree</span>
</button>
<button class="p-2 rounded-full text-on-surface-variant dark:text-surface-variant hover:bg-on-surface/8 dark:hover:bg-surface-variant/8 transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined">play_arrow</span>
</button>
<button class="p-2 rounded-full text-on-surface-variant dark:text-surface-variant hover:bg-on-surface/8 dark:hover:bg-surface-variant/8 transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined">cloud_upload</span>
</button>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant cursor-pointer hover:opacity-80 transition-opacity">
<img alt="User profile" class="w-full h-full object-cover" data-alt="A close-up portrait of a developer in a dimly lit room illuminated by multiple monitor screens displaying code. The developer has a focused expression, wearing dark clothing. The lighting is cinematic, with high-contrast shadows and cool blue-tinged light reflecting on their face, fitting a modern tech aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDVmIVOXu4MrD3qkexKQAAC4Vt4wtfpkdi2NFY5_Rt2VWgxV3ChOVc6K9PvN9GNbIjijhSPdheZrdf3TP5yS5upXCRXbOC0eWd_rgmB5EO1ip_hZ3vWzgmO5SIZ2rw_eU-lapfjhVCB19Zxie0mgmhQTgaczTo_IkU1IvYa3JqieRJkoRp5iZBAzyg5nb_LU0sfoVx7AG_XZYvFKreeojJebn8MAumprhofo2nBmSTiRJChSj4aDeK8"/>
</div>
</div>
</nav>
<!-- Main Content Area -->
<div class="flex flex-1 overflow-hidden relative">
<!-- Settings Sub-Nav (Left Pane) -->
<aside class="w-sidebar_width h-full bg-surface-container dark:bg-[#1a1716] border-r border-outline-variant dark:border-[#383230] flex flex-col py-md shrink-0">
<div class="px-6 mb-6">
<h2 class="font-headline-sm text-headline-sm text-on-surface dark:text-[#ece0dc]">Settings</h2>
</div>
<nav class="flex-1 px-3 space-y-1">
<button class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant dark:text-[#cac4c2] hover:bg-on-surface/8 dark:hover:bg-white/5 transition-all text-left font-body-md text-body-md group active:scale-97 duration-150">
<span class="material-symbols-outlined group-hover:text-primary dark:group-hover:text-primary-fixed-dim transition-colors">person</span>
                    Account
                </button>
<!-- Active Item -->
<button class="w-full flex items-center gap-3 px-4 py-3 bg-primary-container/10 dark:bg-[#ffb690]/10 text-on-surface dark:text-[#ece0dc] transition-all text-left font-body-md text-body-md font-medium border-l-4 border-primary dark:border-[#ffb690] rounded-r-lg active:scale-97 duration-150">
<span class="material-symbols-outlined text-primary dark:text-[#ffb690]" style="font-variation-settings: 'FILL' 1;">palette</span>
                    Appearance
                </button>
<button class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant dark:text-[#cac4c2] hover:bg-on-surface/8 dark:hover:bg-white/5 transition-all text-left font-body-md text-body-md group active:scale-97 duration-150">
<span class="material-symbols-outlined group-hover:text-primary dark:group-hover:text-primary-fixed-dim transition-colors">security</span>
                    Security
                </button>
</nav>
<div class="px-3 mt-auto">
<button class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-error hover:bg-error/10 transition-all text-left font-body-md text-body-md active:scale-97 duration-150">
<span class="material-symbols-outlined">warning</span>
                    Danger Zone
                </button>
</div>
</aside>
<!-- Main Settings Canvas -->
<main class="flex-1 overflow-y-auto p-8 lg:p-12 relative bg-[#151312]">
<div class="max-w-4xl mx-auto space-y-12 pb-24">
<!-- Section Header -->
<div>
<h1 class="font-headline-sm text-[32px] leading-[40px] text-on-surface dark:text-[#ece0dc] font-medium mb-2">Appearance</h1>
<p class="font-body-md text-body-md text-on-surface-variant dark:text-[#cac4c2]">Customize how CodePad looks on your device.</p>
</div>
<!-- Theme Selection -->
<section class="space-y-6">
<h3 class="font-title-md text-title-md text-on-surface dark:text-[#ece0dc]">Theme Preference</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Dark Theme Card (Active) -->
<div class="relative group cursor-pointer active:scale-97 transition-transform duration-150">
<div class="absolute -inset-0.5 bg-primary dark:bg-[#ffb690] rounded-xl blur opacity-30 group-hover:opacity-50 transition duration-300"></div>
<div class="relative rounded-xl border-2 border-primary dark:border-[#ffb690] bg-[#1a1716] overflow-hidden flex flex-col h-full">
<div class="h-32 bg-[#12100f] border-b border-[#383230] p-4 flex flex-col gap-2 relative">
<!-- Mock IDE Header -->
<div class="flex gap-1.5 items-center mb-2">
<div class="w-2.5 h-2.5 rounded-full bg-error/50"></div>
<div class="w-2.5 h-2.5 rounded-full bg-secondary-container/50"></div>
<div class="w-2.5 h-2.5 rounded-full bg-primary/50"></div>
</div>
<!-- Mock IDE Code -->
<div class="space-y-1.5 opacity-60">
<div class="w-3/4 h-2 rounded bg-primary-fixed-dim/40"></div>
<div class="w-1/2 h-2 rounded bg-[#ece0dc]/40 ml-4"></div>
<div class="w-2/3 h-2 rounded bg-[#ece0dc]/40 ml-4"></div>
</div>
</div>
<div class="p-4 flex justify-between items-center bg-[#1a1716]">
<span class="font-title-md text-title-md text-[#ece0dc]">Dark Mode</span>
<span class="material-symbols-outlined text-primary dark:text-[#ffb690]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<!-- Light Theme Card (Inactive) -->
<div class="relative group cursor-pointer active:scale-97 transition-transform duration-150">
<div class="relative rounded-xl border-2 border-outline-variant dark:border-[#383230] hover:border-primary-fixed-dim/50 bg-[#2b2827] overflow-hidden flex flex-col h-full transition-colors">
<div class="h-32 bg-[#f8ebe7] border-b border-outline-variant/30 p-4 flex flex-col gap-2">
<!-- Mock IDE Header -->
<div class="flex gap-1.5 items-center mb-2">
<div class="w-2.5 h-2.5 rounded-full bg-error/50"></div>
<div class="w-2.5 h-2.5 rounded-full bg-secondary-container/50"></div>
<div class="w-2.5 h-2.5 rounded-full bg-primary/50"></div>
</div>
<!-- Mock IDE Code -->
<div class="space-y-1.5 opacity-80">
<div class="w-3/4 h-2 rounded bg-primary/40"></div>
<div class="w-1/2 h-2 rounded bg-on-surface/40 ml-4"></div>
<div class="w-2/3 h-2 rounded bg-on-surface/40 ml-4"></div>
</div>
</div>
<div class="p-4 flex justify-between items-center bg-[#2b2827]">
<span class="font-title-md text-title-md text-[#cac4c2]">Light Mode</span>
</div>
</div>
</div>
</div>
</section>
<div class="h-px w-full bg-outline-variant dark:bg-[#383230]"></div>
<!-- Editor Font Settings -->
<section class="space-y-6">
<h3 class="font-title-md text-title-md text-on-surface dark:text-[#ece0dc]">Editor Typography</h3>
<div class="bg-surface-container dark:bg-[#1a1716] border border-outline-variant dark:border-[#383230] rounded-xl p-6 space-y-6">
<div>
<div class="flex justify-between items-center mb-4">
<label class="font-body-md text-body-md text-on-surface-variant dark:text-[#cac4c2]">Font Size</label>
<span class="font-code-body text-code-body text-primary dark:text-[#ffb690] bg-primary/10 px-2 py-1 rounded">14px</span>
</div>
<input class="w-full h-2 bg-outline-variant dark:bg-[#383230] rounded-lg appearance-none cursor-pointer accent-primary dark:accent-[#ffb690]" max="24" min="10" type="range" value="14"/>
</div>
<!-- Code Preview -->
<div class="bg-[#12100f] border border-[#383230] rounded-lg p-4 font-code-body text-code-body text-[#ece0dc] overflow-x-auto shadow-inner">
<pre class="m-0 text-[14px] leading-relaxed"><span class="text-[#ffb690]">public class</span> <span class="text-secondary-fixed-dim">Main</span> {
    <span class="text-[#ffb690]">public static void</span> <span class="text-tertiary-fixed-dim">main</span>(String[] args) {
        System.out.<span class="text-tertiary-fixed-dim">println</span>(<span class="text-secondary-container">"Hello, CodePad!"</span>);
    }
}</pre>
</div>
</div>
</section>
</div>
</main>
</div>
