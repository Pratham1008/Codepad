<style>
        .animate-card-enter {
            animation: cardEnter 0.22s ease-out forwards;
        }
        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .pulse-primary {
            animation: pulsePrimary 2s infinite;
        }
        @keyframes pulsePrimary {
            0% { box-shadow: 0 0 0 0 rgba(120, 49, 0, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(120, 49, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(120, 49, 0, 0); }
        }

        .dark-ambient-panel {
            background-color: #151312;
            position: relative;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 10s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
        }
        
        .bracket-motif::before {
            content: "{";
            position: absolute;
            left: -50px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 400px;
            color: rgba(255, 255, 255, 0.03);
            font-family: 'JetBrains Mono', monospace;
            pointer-events: none;
        }
        .bracket-motif::after {
            content: "}";
            position: absolute;
            right: -50px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 400px;
            color: rgba(255, 255, 255, 0.03);

<script>
        // Simple particle generator for ambient background
        const particlesContainer = document.getElementById('particles');
        if(particlesContainer) {
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Randomize properties
                const size = Math.random() * 4 + 1 + 'px';
                particle.style.width = size;
                particle.style.height = size;
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.top = Math.random() * 100 + 'vh';
                particle.style.animationDuration = (Math.random() * 15 + 5) + 's';
                particle.style.animationDelay = (Math.random() * 5) + 's';
                
                particlesContainer.appendChild(particle);
            }
        }
    </script>
