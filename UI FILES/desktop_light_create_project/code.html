<body class="bg-surface font-body-md text-on-surface h-screen w-screen overflow-hidden antialiased">
<!-- Background Dashboard (Dimmed and Blurred) -->
<div class="fixed inset-0 z-0">
<img alt="Dashboard Background" class="w-full h-full object-cover filter blur-sm brightness-50" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBzXw52D_KeTGmy7GOVl2grrv3SJCsG-2RRYsrsH7uQ5B-fI3I3IGrN69ZEU2wJbbKY6Hv32lL3s42o5ZDeBuCQZkjwUkPuZkiDbWi8jZFi9s4ZN1KFgt73YniWDtC-MIwmEQuO7L87AnGeMNQWp7DDhadWiqMqa-ONkKs0Wfpx5u1sGv7jkUHlGInF1V5qs03iGg0Xv1JXRCC0iUAo6ids9IU1goSCFjT1NKH7duuXzSP5ZC8HdIeD"/>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-scrim/50 backdrop-blur-sm">
<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-[520px] rounded-[24px] shadow-lg flex flex-col transform transition-all">
<!-- Header -->
<div class="flex items-center justify-between p-lg border-b border-outline-variant">
<h2 class="font-headline-sm text-headline-sm text-on-surface font-semibold">Create New Project</h2>
<button class="text-on-surface-variant hover:text-on-surface hover:bg-on-surface/[0.08] p-2 rounded-full transition-colors active:scale-[0.97] duration-150">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Body -->
<div class="p-lg flex flex-col gap-lg">
<!-- Project Name Input -->
<div class="flex flex-col gap-sm">
<label class="font-title-md text-title-md text-on-surface font-medium" for="projectName">Project Name</label>
<input class="w-full bg-surface-container text-on-surface font-body-md text-body-md px-md py-3 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-on-surface-variant/70" id="projectName" placeholder="e.g. Student Management System" type="text"/>
</div>
<!-- Language Selection -->
<div class="flex flex-col gap-sm">
<label class="font-title-md text-title-md text-on-surface font-medium">Language</label>
<div class="grid grid-cols-3 gap-md" id="languageSelector">
<!-- Java Card (Selected) -->
<div class="language-card cursor-pointer flex flex-col items-center justify-center p-lg rounded-xl border-2 border-primary bg-primary-container/[0.08] active:scale-[0.97] transition-all duration-150" data-lang="java">
<span class="material-symbols-outlined text-4xl text-primary mb-sm" data-icon="local_cafe" style="font-variation-settings: 'FILL' 1;">local_cafe</span>
<span class="font-title-md text-title-md text-on-surface font-medium">Java</span>
</div>
<!-- Python Card -->
<div class="language-card cursor-pointer flex flex-col items-center justify-center p-lg rounded-xl border-2 border-outline-variant hover:border-primary/50 hover:bg-on-surface/[0.04] bg-surface-container-lowest active:scale-[0.97] transition-all duration-150" data-lang="python">
<span class="material-symbols-outlined text-4xl text-on-surface-variant mb-sm" data-icon="code">code</span>
<span class="font-title-md text-title-md text-on-surface font-medium">Python</span>
</div>
<!-- C++ Card -->
<div class="language-card cursor-pointer flex flex-col items-center justify-center p-lg rounded-xl border-2 border-outline-variant hover:border-primary/50 hover:bg-on-surface/[0.04] bg-surface-container-lowest active:scale-[0.97] transition-all duration-150" data-lang="cpp">
<span class="material-symbols-outlined text-4xl text-on-surface-variant mb-sm" data-icon="terminal">terminal</span>
<span class="font-title-md text-title-md text-on-surface font-medium">C++</span>
</div>
</div>
</div>
<!-- File Preview -->
<div class="flex items-center gap-sm bg-surface-container-highest p-md rounded-lg">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="description">description</span>
<span class="font-body-md text-body-md text-on-surface-variant">Entry file:</span>
<span class="font-code-body text-code-body text-on-surface font-medium" id="entryFilePreview">Main.java</span>
</div>
</div>
<!-- Footer -->
<div class="flex items-center justify-end gap-md p-lg border-t border-outline-variant bg-surface-container-low rounded-b-[24px]">
<button class="font-title-md text-title-md text-primary px-lg py-2.5 rounded-lg hover:bg-primary/10 transition-colors active:scale-[0.97] duration-150">
                    Cancel
                </button>
<button class="font-title-md text-title-md text-on-primary bg-primary px-lg py-2.5 rounded-lg hover:bg-primary/90 shadow-sm transition-colors active:scale-[0.97] duration-150 flex items-center gap-sm">
<span class="material-symbols-outlined text-on-primary text-sm" data-icon="add">add</span>
                    Create Project
                </button>
</div>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.language-card');
            const previewText = document.getElementById('entryFilePreview');

            const fileMap = {
                'java': 'Main.java',
                'python': 'main.py',
                'cpp': 'main.cpp'
            };

            cards.forEach(card => {
                card.addEventListener('click', () => {
                    // Reset all cards
                    cards.forEach(c => {
                        c.classList.remove('border-primary', 'bg-primary-container/[0.08]');
                        c.classList.add('border-outline-variant', 'bg-surface-container-lowest');
                        const icon = c.querySelector('.material-symbols-outlined');
                        icon.classList.remove('text-primary');
                        icon.classList.add('text-on-surface-variant');
                        icon.style.fontVariationSettings = "'FILL' 0";
                    });

                    // Set active card
                    card.classList.remove('border-outline-variant', 'bg-surface-container-lowest');
                    card.classList.add('border-primary', 'bg-primary-container/[0.08]');
                    const icon = card.querySelector('.material-symbols-outlined');
                    icon.classList.remove('text-on-surface-variant');
                    icon.classList.add('text-primary');
                    icon.style.fontVariationSettings = "'FILL' 1";

                    // Update preview text
                    const lang = card.getAttribute('data-lang');
                    previewText.textContent = fileMap[lang];
                });
            });
        });
    </script>
</body></html>
