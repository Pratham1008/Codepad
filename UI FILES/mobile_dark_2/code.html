<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CodePad - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed-dim": "#ffb690",
                    "surface-bright": "#fff8f6",
                    "on-primary-fixed": "#341100",
                    "on-error-container": "#93000a",
                    "on-secondary-fixed": "#251a00",
                    "surface-container-highest": "#ece0dc",
                    "surface-variant": "#ece0dc",
                    "inverse-surface": "#362f2d",
                    "on-error": "#ffffff",
                    "secondary-container": "#fdd677",
                    "primary": "#783100",
                    "outline-variant": "#ddc1b4",
                    "on-surface-variant": "#564339",
                    "secondary-fixed-dim": "#e8c266",
                    "primary-fixed": "#ffdbca",
                    "on-background": "#201a18",
                    "tertiary-fixed": "#ffd9e3",
                    "on-secondary-fixed-variant": "#5a4400",
                    "on-primary-container": "#ffceb6",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed-variant": "#633b48",
                    "surface-container-high": "#f2e5e2",
                    "secondary-fixed": "#ffdf96",
                    "primary-container": "#9d4300",
                    "error": "#ba1a1a",
                    "outline": "#897267",
                    "surface-tint": "#9d4300",
                    "on-surface": "#201a18",
                    "on-tertiary-container": "#ffcbda",
                    "on-secondary-container": "#775b01",
                    "tertiary-fixed-dim": "#eeb8c8",
                    "surface-dim": "#e4d7d4",
                    "on-primary-fixed-variant": "#783200",
                    "inverse-on-surface": "#fbeeea",
                    "surface": "#fff8f6",
                    "surface-container-low": "#fef1ed",
                    "error-container": "#ffdad6",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed": "#31111d",
                    "on-secondary": "#ffffff",
                    "secondary": "#765a00",
                    "tertiary": "#633b48",
                    "on-primary": "#ffffff",
                    "background": "#fff8f6",
                    "tertiary-container": "#7d5260",
                    "surface-container": "#f8ebe7",
                    "inverse-primary": "#ffb690",
                    "dark-surface": "#151312",
                    "dark-surface-container-highest": "#373433"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "sidebar_width": "260px",
                    "lg": "24px",
                    "xl": "32px",
                    "gutter": "1px",
                    "base": "4px",
                    "md": "16px",
                    "xs": "4px",
                    "sm": "8px"
            },
            "fontFamily": {
                    "display-lg": ["Inter"],
                    "code-table": ["JetBrains Mono"],
                    "code-body": ["JetBrains Mono"],
                    "body-md": ["Inter"],
                    "title-md": ["Inter"],
                    "headline-sm": ["Inter"],
                    "label-sm": ["Inter"]
            },
            "fontSize": {
                    "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400"}],
                    "code-table": ["12px", {"lineHeight": "18px", "fontWeight": "400"}],
                    "code-body": ["14px", {"lineHeight": "22px", "fontWeight": "400"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "title-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "500"}],
                    "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "400"}],
                    "label-sm": ["11px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}]
            },
            "animation": {
                "fade-slide-up": "fadeSlideUp 0.6s ease-out forwards",
                "pulse-subtle": "pulseSubtle 2s infinite"
            },
            "keyframes": {
                "fadeSlideUp": {
                    "0%": { opacity: "0", transform: "translateY(20px)" },
                    "100%": { opacity: "1", transform: "translateY(0)" }
                },
                "pulseSubtle": {
                    "0%, 100%": { opacity: "1" },
                    "50%": { opacity: "0.85" }
                }
            }
          },
        },
      }
    </script>
<style>
        /* Ensuring dark mode styles map to requested tokens since we are forcing a dark auth screen */
        .auth-bg { background-color: #151312; }
        .auth-card { background-color: #373433; }
        .text-dark-on-surface { color: #ece0dc; }
        .text-dark-on-surface-variant { color: #ddc1b4; }
        .border-dark-outline { border-color: #897267; }
    </style>
</head>
<body class="auth-bg h-screen w-full flex items-center justify-center font-body-md text-body-md overflow-hidden text-dark-on-surface">
<!-- Top Accent Strip -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary-fixed-dim z-50"></div>
<!-- Theme Toggle (Visual only for mock) -->
<button aria-label="Toggle Theme" class="absolute top-md right-md p-2 rounded-full hover:bg-white/[0.08] transition-colors">
<span class="material-symbols-outlined text-dark-on-surface-variant" data-icon="light_mode">light_mode</span>
</button>
<!-- Main Auth Card -->
<main class="w-full max-w-[390px] px-md animate-fade-slide-up">
<div class="auth-card rounded-xl p-xl flex flex-col items-center w-full shadow-2xl relative overflow-hidden">
<!-- Logo -->
<div class="w-24 h-24 mb-6 rounded-lg bg-black/20 flex items-center justify-center">
<img alt="CodePad Logo" class="w-16 h-16 object-contain rounded-lg" src="https://lh3.googleusercontent.com/aida/AP1WRLuL-LWPWb__0YSygr_dMWTPoV44TikG95KTkOYLbK5SQKxpoDS600NSneXw10uU1QIv_cc1qnjFiOEsOHl60XIgAAPvCM7PKA4_WVOqe43qFAuTb_D0eSJhxshSCpiVqNh3hIDOXFqUbFNql8QdxkiKBEj2z2tWwE4nzZB6G5tznX20xM4XstYkWPoH9QEFrBzpbDIeSQKlDPJIJQNjaAUVw24BTdaomhEulscGkQ0wlDwwAvnHG6bduW8"/>
</div>
<!-- Header -->
<h1 class="font-headline-sm text-headline-sm font-bold mb-2 text-center w-full text-white">Welcome back</h1>
<p class="text-dark-on-surface-variant text-center mb-8 font-body-md">Sign in to continue to CodePad.</p>
<!-- Actions -->
<div class="w-full flex flex-col gap-4">
<!-- Primary Action -->
<button class="w-full bg-primary-fixed-dim text-on-primary-fixed font-title-md text-title-md py-3 px-4 rounded-xl flex items-center justify-center gap-2 hover:bg-primary-fixed-dim/90 active:scale-[0.97] transition-all duration-150 animate-pulse-subtle shadow-md shadow-primary-fixed-dim/20">
<span class="material-symbols-outlined" data-icon="passkey" style="font-variation-settings: 'FILL' 1;">passkey</span>
                    Continue with Passkey
                </button>
<!-- Divider -->
<div class="flex items-center w-full my-2">
<div class="flex-grow h-px bg-dark-outline/30 border-t border-border-dark-outline/30"></div>
<span class="px-3 text-dark-on-surface-variant font-label-sm text-label-sm">OR</span>
<div class="flex-grow h-px bg-dark-outline/30 border-t border-border-dark-outline/30"></div>
</div>
<!-- Secondary Actions (Mock inputs) -->
<button class="w-full border border-dark-outline text-dark-on-surface font-title-md text-title-md py-3 px-4 rounded-xl flex items-center justify-center gap-2 hover:bg-white/[0.08] active:scale-[0.97] transition-all duration-150">
<span class="material-symbols-outlined" data-icon="mail">mail</span>
                    Continue with Email
                </button>
<button class="w-full border border-dark-outline text-dark-on-surface font-title-md text-title-md py-3 px-4 rounded-xl flex items-center justify-center gap-2 hover:bg-white/[0.08] active:scale-[0.97] transition-all duration-150">
<span class="material-symbols-outlined" data-icon="terminal">terminal</span>
                    SSO via CLI
                </button>
</div>
<!-- Footer Links -->
<div class="mt-8 text-center w-full">
<a class="text-primary-fixed-dim hover:text-primary-fixed font-label-sm text-label-sm transition-colors hover:underline underline-offset-4" href="#">
                    New here? Create an account
                </a>
</div>
</div>
</main>
<!-- Subtle decorative glow behind card -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-primary-fixed-dim/5 rounded-full blur-[80px] pointer-events-none -z-10"></div>
</body></html>
