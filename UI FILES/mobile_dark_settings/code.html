<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CodePad - Appearance Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#eeb8c8",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#fff8f6",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#31111d",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#ffceb6",
                        "outline": "#897267",
                        "background": "#fff8f6",
                        "surface": "#fff8f6",
                        "surface-container-low": "#fef1ed",
                        "tertiary": "#633b48",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#7d5260",
                        "primary-container": "#9d4300",
                        "inverse-primary": "#ffb690",
                        "outline-variant": "#ddc1b4",
                        "secondary-container": "#fdd677",
                        "on-surface": "#201a18",
                        "primary-fixed-dim": "#ffb690",
                        "surface-container-high": "#f2e5e2",
                        "on-tertiary-container": "#ffcbda",
                        "on-error": "#ffffff",
                        "inverse-surface": "#362f2d",
                        "on-secondary-container": "#775b01",
                        "on-primary-fixed-variant": "#783200",
                        "surface-variant": "#ece0dc",
                        "on-secondary-fixed": "#251a00",
                        "surface-container-highest": "#ece0dc",
                        "on-secondary-fixed-variant": "#5a4400",
                        "inverse-on-surface": "#fbeeea",
                        "on-secondary": "#ffffff",
                        "secondary": "#765a00",
                        "on-background": "#201a18",
                        "on-surface-variant": "#564339",
                        "tertiary-fixed": "#ffd9e3",
                        "surface-container": "#f8ebe7",
                        "on-primary-fixed": "#341100",
                        "surface-tint": "#9d4300",
                        "secondary-fixed": "#ffdf96",
                        "on-tertiary-fixed-variant": "#633b48",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#ffdbca",
                        "surface-dim": "#e4d7d4",
                        "secondary-fixed-dim": "#e8c266",
                        "error": "#ba1a1a",
                        "primary": "#783100"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "md": "16px",
                        "xl": "32px",
                        "sidebar_width": "260px",
                        "gutter": "1px",
                        "sm": "8px",
                        "base": "4px",
                        "xs": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "title-md": ["Inter"],
                        "code-body": ["JetBrains Mono"],
                        "label-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "code-table": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "title-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "500" }],
                        "code-body": ["14px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "headline-sm": ["24px", { "lineHeight": "32px", "fontWeight": "400" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "code-table": ["12px", { "lineHeight": "18px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom dark theme overrides for mobile setting view as requested by prompt */
        .dark {
            --tw-bg-opacity: 1;
            background-color: #151312; /* Required Dark background */
        }
        .dark .bg-surface-container {
            background-color: #211e1c;
        }
        .dark .bg-surface-container-high {
            background-color: #2d2926;
        }
        .dark .text-on-background {
            color: #ece0dc;
        }
        .dark .text-primary-fixed-dim {
            color: #FFB690; /* Terracotta accent */
        }
        .dark .border-primary-fixed-dim {
            border-color: #FFB690;
        }
        .dark .bg-primary-container {
            background-color: rgba(255, 182, 144, 0.15); /* Subtle active state */
        }
        
        /* Slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #FFB690;
            cursor: pointer;
            margin-top: -8px; 
            box-shadow: 0 0 0 4px rgba(255, 182, 144, 0.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #564339;
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
    </style>
</head>
<body class="bg-[#151312] text-on-background font-body-md min-h-screen flex flex-col pb-20">
<!-- Header -->
<header class="flex items-center px-md h-[56px] border-b border-outline-variant/30 sticky top-0 bg-[#151312]/90 backdrop-blur-md z-40">
<button class="w-10 h-10 flex items-center justify-center rounded-full active:scale-[0.97] duration-150 hover:bg-on-surface/[0.08] transition-colors -ml-2 text-primary-fixed-dim">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="ml-2 font-headline-sm text-headline-sm text-on-background">Appearance</h1>
</header>
<!-- Main Content -->
<main class="flex-1 p-md flex flex-col gap-lg max-w-2xl mx-auto w-full">
<!-- Theme Selection -->
<section class="flex flex-col gap-sm">
<h2 class="font-title-md text-title-md text-on-surface-variant dark:text-outline mb-2">Theme</h2>
<!-- Dark Theme Card (Selected) -->
<div class="relative rounded-xl border-2 border-primary-fixed-dim bg-surface-container-high p-4 flex flex-col gap-3 overflow-hidden cursor-pointer active:scale-[0.99] transition-transform duration-150 group">
<div class="absolute top-4 right-4 w-6 h-6 rounded-full bg-primary-fixed-dim flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-[#151312]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">dark_mode</span>
<span class="font-title-md text-title-md text-on-background">Dark</span>
</div>
<!-- Mock Editor Preview inside card -->
<div class="mt-2 rounded-lg bg-[#151312] border border-outline-variant/30 p-3 flex flex-col gap-2 font-code-body text-code-body opacity-90 group-hover:opacity-100 transition-opacity">
<div class="flex gap-2">
<span class="text-primary-fixed-dim">const</span>
<span class="text-[#ffdf96]">theme</span>
<span class="text-outline">=</span>
<span class="text-[#eeb8c8]">'dark'</span><span class="text-outline">;</span>
</div>
<div class="flex gap-2">
<span class="text-primary-fixed-dim">function</span>
<span class="text-[#ffb690]">render</span><span class="text-outline">() {</span>
</div>
<div class="flex gap-2 pl-4">
<span class="text-outline">return</span>
<span class="text-[#e8c266]">true</span><span class="text-outline">;</span>
</div>
<div class="flex gap-2">
<span class="text-outline">}</span>
</div>
</div>
</div>
<!-- Light Theme Card (Unselected) -->
<div class="relative rounded-xl border border-outline-variant/50 bg-surface-container p-4 flex flex-col gap-3 overflow-hidden cursor-pointer active:scale-[0.99] transition-transform duration-150 mt-2 opacity-70 hover:opacity-100">
<div class="absolute top-4 right-4 w-6 h-6 rounded-full border border-outline-variant/50 flex items-center justify-center">
</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline">light_mode</span>
<span class="font-title-md text-title-md text-on-surface-variant">Light</span>
</div>
<!-- Mock Editor Preview inside card (Light variant style) -->
<div class="mt-2 rounded-lg bg-surface-bright border border-outline-variant/30 p-3 flex flex-col gap-2 font-code-body text-code-body opacity-80 filter grayscale-[50%]">
<div class="flex gap-2">
<span class="text-primary">const</span>
<span class="text-[#765a00]">theme</span>
<span class="text-on-surface">=</span>
<span class="text-[#633b48]">'light'</span><span class="text-on-surface">;</span>
</div>
<div class="flex gap-2">
<span class="text-primary">function</span>
<span class="text-primary-container">render</span><span class="text-on-surface">() {</span>
</div>
<div class="flex gap-2 pl-4">
<span class="text-on-surface">return</span>
<span class="text-[#5a4400]">true</span><span class="text-on-surface">;</span>
</div>
<div class="flex gap-2">
<span class="text-on-surface">}</span>
</div>
</div>
</div>
</section>
<hr class="border-outline-variant/30 my-2"/>
<!-- Font Size Selection -->
<section class="flex flex-col gap-sm">
<h2 class="font-title-md text-title-md text-on-surface-variant dark:text-outline mb-2">Editor Font Size</h2>
<!-- Live Preview -->
<div class="rounded-xl bg-[#1a1817] border border-outline-variant/30 p-md min-h-[100px] flex items-center justify-center overflow-hidden">
<p class="font-code-body text-code-body text-on-background whitespace-nowrap" id="font-preview" style="font-size: 16px;">
<span class="text-primary-fixed-dim">console</span><span class="text-outline">.</span><span class="text-[#ffb690]">log</span><span class="text-outline">(</span><span class="text-[#eeb8c8]">'Hello CodePad'</span><span class="text-outline">);</span>
</p>
</div>
<!-- Slider Control -->
<div class="flex items-center gap-4 mt-4 px-2">
<span class="font-title-md text-title-md text-outline">12</span>
<input class="flex-1" id="fontSizeSlider" max="24" min="12" oninput="document.getElementById('font-preview').style.fontSize = this.value + 'px'; document.getElementById('fontSizeValue').innerText = this.value + 'px';" type="range" value="16"/>
<span class="font-title-md text-title-md text-outline">24</span>
</div>
<div class="text-center mt-2 font-label-sm text-label-sm text-primary-fixed-dim" id="fontSizeValue">16px</div>
</section>
</main>
<!-- BottomNavBar (Settings is Active) -->
<!-- Applying rules: Semantic mapping Settings page -> Settings tab active -->
<!-- Platform logic: rendered on Mobile (no md:hidden restriction here since it's a mobile view as per prompt, but adhering to the JSON style_shell_layout) -->
<nav class="bg-surface dark:bg-surface-container border-t border-outline-variant/30 flat no shadows fixed bottom-0 left-0 w-full flex justify-around items-center h-16 md:hidden px-4 z-50">
<!-- Files -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-on-surface/[0.04] active:scale-[0.97] duration-150 w-16 rounded-xl h-14" href="#">
<span class="material-symbols-outlined mb-1">description</span>
<span class="font-label-sm text-label-sm">Files</span>
</a>
<!-- Editor -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-on-surface/[0.04] active:scale-[0.97] duration-150 w-16 rounded-xl h-14" href="#">
<span class="material-symbols-outlined mb-1">code</span>
<span class="font-label-sm text-label-sm">Editor</span>
</a>
<!-- Terminal -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-on-surface/[0.04] active:scale-[0.97] duration-150 w-16 rounded-xl h-14" href="#">
<span class="material-symbols-outlined mb-1">terminal</span>
<span class="font-label-sm text-label-sm">Terminal</span>
</a>
<!-- Settings (ACTIVE) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-[0.97] duration-150 min-w-16" href="#">
<span class="material-symbols-outlined mb-1 text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-sm text-label-sm text-primary-fixed-dim">Settings</span>
</a>
</nav>
</body></html>
