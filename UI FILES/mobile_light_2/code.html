<style>

            background-size: cover, 20px 20px;
        }
        
        .slide-up-fade-in {
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }

        .pulse-subtle {
            animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-ring {
            0%, 100% { box-shadow: 0 0 0 0 rgba(120, 49, 0, 0.4); }
            50% { box-shadow: 0 0 0 4px rgba(120, 49, 0, 0); }
        }
    </style>

<body class="bg-surface-container-highest min-h-screen w-full flex flex-col relative overflow-hidden">

</button>

<!-- Logo Container -->
<div class="flex flex-col items-center mb-xl w-full slide-up-fade-in stagger-1">

<p class="font-body-md text-body-md text-on-surface-variant mt-xs text-center">Sign in to continue your workspace.</p>
</div>
<!-- Auth Actions Container -->
<div class="w-full flex flex-col gap-md slide-up-fade-in stagger-2">
<!-- Primary Action: Passkey -->
<button class="w-full h-12 bg-primary text-on-primary rounded-lg font-title-md text-title-md flex items-center justify-center gap-sm hover:bg-primary-container hover:text-on-primary-container transition-all active:scale-[0.97] duration-150 pulse-subtle relative overflow-hidden group">
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
                Continue with Passkey
            </button>
<!-- Divider -->
<div class="flex items-center w-full my-sm slide-up-fade-in stagger-3">
<div class="flex-1 h-gutter bg-outline-variant/50"></div>
<span class="px-sm font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">or</span>
<div class="flex-1 h-gutter bg-outline-variant/50"></div>
</div>

                Continue with Email
            </button>
</div>

<div class="mt-xl slide-up-fade-in stagger-5 w-full text-center">
<a class="font-body-md text-body-md text-primary hover:text-primary-container transition-colors inline-block active:scale-[0.97] duration-150" href="#">
