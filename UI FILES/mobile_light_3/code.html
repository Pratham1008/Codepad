<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CodePad - Mobile Dashboard</title>

                    "display-lg": [

                                    "letterSpacing": "-0.25px",

        },
      }

<style>
        .slide-up {
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpAnim 0.5s ease-out forwards;
        }
        @keyframes slideUpAnim {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md h-screen w-screen overflow-hidden flex flex-col antialiased">
<!-- Top Navigation Bar -->
<header class="flex justify-between items-center px-md w-full h-[48px] z-50 bg-surface/80 backdrop-blur-md sticky top-0 shrink-0 border-b-0" style="box-shadow: 0 1px 0 rgba(0,0,0,0.05);">
<div class="flex items-center gap-2">
<img alt="CodePad Logo" class="h-6 w-6 rounded-sm object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLv1_OvQ7qmc8DmZw4_Eux1x6k4Jt_7T4LvEKu4hGA7sr_0TxJk-vppVuErwAJYppKa6Uz80uNpqkrPHTQjR4yMPgdzRe-bV3a1SxIO3srEvcK4w4SnKOiMbxgIMn6aO7f5NJ0ZzfInqXxaWiWM9wja71snRDF8_7mQyF_H3kmUdOLa6ppgth_ZE4RxMBNHxYP7Cfgiv_gqAqiuSfcFXHJqLJzhuY9d5REtmnikx_1CibEwclMS7TGwDXA"/>
<span class="font-headline-sm text-headline-sm font-bold text-primary">CodePad</span>
</div>
<div class="flex items-center gap-4 text-on-surface-variant">
<button class="hover:bg-on-surface/[0.08] transition-colors rounded-full p-1 active:scale-[0.97] duration-150 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">search</span>
</button>
<button class="hover:bg-on-surface/[0.08] transition-colors rounded-full p-1 active:scale-[0.97] duration-150 flex items-center justify-center">
<img class="w-7 h-7 rounded-full object-cover" data-alt="A close up, vibrant professional headshot of a young developer in a modern, well lit office space. They are wearing a simple black t-shirt and have a warm, welcoming smile. The background is slightly blurred with light-mode aesthetics, featuring soft whites and warm terracotta accents. High quality, sharp focus." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBUm5Tbf9bU3wlHhZRvfZFhJXddY5GFN3EgaN-3sp6grHT_rr8XrMuFEr_kgutwiHnPSBf2go6T1auYvifEVO-w5qiHzRvOuTBttZLigatK5_Lb_neQQ5XwY8SFiuG1aUaAbRNN-uD0AKco2admxHACFP0QjmDyVxEQ_AGw9eUk3eyWyjueh31WdPzA4yFq-mpBhcD4DW--r09GhLL_KPFNYXaNTSGgx7iljK6bNzmn-tqPaIU8Nq8v"/>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto pb-24 relative px-4 pt-4 no-scrollbar">
<!-- Filter Tabs (Scrollable Row) -->
<div class="flex gap-2 overflow-x-auto no-scrollbar pb-2 mb-4 -mx-4 px-4 snap-x">
<button class="snap-start shrink-0 px-4 py-1.5 rounded-full bg-primary-container text-on-primary-container font-label-sm text-label-sm active:scale-[0.97] transition-transform duration-150 whitespace-nowrap">All Projects</button>
<button class="snap-start shrink-0 px-4 py-1.5 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm hover:bg-on-surface/[0.08] active:scale-[0.97] transition-all duration-150 whitespace-nowrap border border-outline-variant">Recent</button>
<button class="snap-start shrink-0 px-4 py-1.5 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm hover:bg-on-surface/[0.08] active:scale-[0.97] transition-all duration-150 whitespace-nowrap border border-outline-variant">Java</button>
<button class="snap-start shrink-0 px-4 py-1.5 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm hover:bg-on-surface/[0.08] active:scale-[0.97] transition-all duration-150 whitespace-nowrap border border-outline-variant">Python</button>
<button class="snap-start shrink-0 px-4 py-1.5 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm hover:bg-on-surface/[0.08] active:scale-[0.97] transition-all duration-150 whitespace-nowrap border border-outline-variant">C++</button>
</div>
<!-- Projects Stack -->
<div class="flex flex-col gap-3">
<!-- Project 1: Student Management -->
<div class="bg-surface-container-low rounded-xl p-4 flex flex-col gap-2 slide-up active:scale-[0.97] transition-transform duration-150 cursor-pointer border border-outline-variant relative overflow-hidden group">
<div class="absolute inset-0 bg-on-surface/[0.08] opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="flex justify-between items-start z-10">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-lg bg-surface-container-high flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">folder</span>
</div>
<div>
<h3 class="font-title-md text-title-md text-on-surface">Student Management</h3>
<span class="font-label-sm text-label-sm text-on-surface-variant">Last edited 2h ago</span>
</div>
</div>
<button class="text-on-surface-variant hover:text-on-surface p-1 rounded-full hover:bg-on-surface/[0.08] transition-colors">
<span class="material-symbols-outlined text-[20px]">more_vert</span>
</button>
</div>
<div class="flex gap-2 mt-1 z-10">
<span class="px-2 py-0.5 rounded bg-surface-variant text-on-surface-variant font-code-table text-code-table">Java</span>
<span class="px-2 py-0.5 rounded bg-surface-variant text-on-surface-variant font-code-table text-code-table">12 files</span>
</div>
</div>
<!-- Project 2: Prime Number -->
<div class="bg-surface-container-low rounded-xl p-4 flex flex-col gap-2 slide-up delay-100 active:scale-[0.97] transition-transform duration-150 cursor-pointer border border-outline-variant relative overflow-hidden group">
<div class="absolute inset-0 bg-on-surface/[0.08] opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="flex justify-between items-start z-10">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-lg bg-surface-container-high flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">terminal</span>
</div>
<div>
<h3 class="font-title-md text-title-md text-on-surface">Prime Number</h3>
<span class="font-label-sm text-label-sm text-on-surface-variant">Last edited yesterday</span>
</div>
</div>
<button class="text-on-surface-variant hover:text-on-surface p-1 rounded-full hover:bg-on-surface/[0.08] transition-colors">
<span class="material-symbols-outlined text-[20px]">more_vert</span>
</button>
</div>
<div class="flex gap-2 mt-1 z-10">
<span class="px-2 py-0.5 rounded bg-surface-variant text-on-surface-variant font-code-table text-code-table">Python</span>
<span class="px-2 py-0.5 rounded bg-surface-variant text-on-surface-variant font-code-table text-code-table">3 files</span>
</div>
</div>
<!-- Project 3: Matrix Multiplication -->
<div class="bg-surface-container-low rounded-xl p-4 flex flex-col gap-2 slide-up delay-200 active:scale-[0.97] transition-transform duration-150 cursor-pointer border border-outline-variant relative overflow-hidden group">
<div class="absolute inset-0 bg-on-surface/[0.08] opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="flex justify-between items-start z-10">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-lg bg-surface-container-high flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">functions</span>
</div>
<div>
<h3 class="font-title-md text-title-md text-on-surface">Matrix Multiplication</h3>
<span class="font-label-sm text-label-sm text-on-surface-variant">Last edited 3 days ago</span>
</div>
</div>
<button class="text-on-surface-variant hover:text-on-surface p-1 rounded-full hover:bg-on-surface/[0.08] transition-colors">
<span class="material-symbols-outlined text-[20px]">more_vert</span>
</button>
</div>
<div class="flex gap-2 mt-1 z-10">
<span class="px-2 py-0.5 rounded bg-surface-variant text-on-surface-variant font-code-table text-code-table">C++</span>
<span class="px-2 py-0.5 rounded bg-surface-variant text-on-surface-variant font-code-table text-code-table">5 files</span>
</div>
</div>
</div>
</main>
<!-- Floating Action Button (+ New Project) -->
<div class="fixed bottom-[88px] right-4 z-40 slide-up delay-300">
<button class="bg-primary hover:bg-on-primary-fixed-variant text-on-primary rounded-2xl w-14 h-14 flex items-center justify-center shadow-lg active:scale-[0.97] transition-all duration-150 flex-col group relative overflow-hidden">
<div class="absolute inset-0 bg-on-primary/[0.08] opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-[28px] z-10">add</span>
</button>
</div>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-16 md:hidden px-4 z-50 bg-surface border-t-0 pb-safe" style="box-shadow: 0 -1px 0 rgba(0,0,0,0.05);">
<!-- Files (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-on-surface/[0.04] active:scale-[0.97] duration-150 w-full h-full rounded-lg relative group">
<div class="absolute inset-0 bg-on-surface/[0.04] opacity-0 group-hover:opacity-100 transition-opacity rounded-lg"></div>
<div class="px-4 py-1 rounded-full flex flex-col items-center justify-center z-10">
<span class="material-symbols-outlined mb-0.5">description</span>
<span class="font-label-sm text-label-sm-mobile">Files</span>
</div>
</button>
<!-- Editor (Active - Maps to Projects/Dashboard context in this view) -->
<button class="flex flex-col items-center justify-center hover:bg-on-surface/[0.04] active:scale-[0.97] duration-150 w-full h-full rounded-lg relative group">
<div class="absolute inset-0 bg-on-surface/[0.04] opacity-0 group-hover:opacity-100 transition-opacity rounded-lg"></div>
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 z-10">
<span class="material-symbols-outlined mb-0.5" style="font-variation-settings: 'FILL' 1;">code</span>
<span class="font-label-sm text-label-sm-mobile font-bold">Editor</span>
</div>
</button>
<!-- Terminal (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-on-surface/[0.04] active:scale-[0.97] duration-150 w-full h-full rounded-lg relative group">
<div class="absolute inset-0 bg-on-surface/[0.04] opacity-0 group-hover:opacity-100 transition-opacity rounded-lg"></div>
<div class="px-4 py-1 rounded-full flex flex-col items-center justify-center z-10">
<span class="material-symbols-outlined mb-0.5">terminal</span>
<span class="font-label-sm text-label-sm-mobile">Terminal</span>
</div>
</button>
<!-- Settings (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-on-surface/[0.04] active:scale-[0.97] duration-150 w-full h-full rounded-lg relative group">
<div class="absolute inset-0 bg-on-surface/[0.04] opacity-0 group-hover:opacity-100 transition-opacity rounded-lg"></div>
<div class="px-4 py-1 rounded-full flex flex-col items-center justify-center z-10">
<span class="material-symbols-outlined mb-0.5">settings</span>
<span class="font-label-sm text-label-sm-mobile">Settings</span>
</div>
</button>
</nav>
<!-- Safe area padding for newer mobile devices -->
<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</body></html>
