<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CodePad - Appearance Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                      "surface": "#fff8f6",

                      "tertiary": "#633b48",
                      "on-error-container": "#93000a",
                      "tertiary-container": "#7d5260",
                      "primary-container": "#9d4300",
                      "inverse-primary": "#ffb690",
                      "outline-variant": "#ddc1b4",
                      "secondary-container": "#fdd677",
                      "on-surface": "#201a18",
                      "primary-fixed-dim": "#ffb690",
                      "surface-container-high": "#f2e5e2",
                      "on-tertiary-container": "#ffcbda",
                      "on-error": "#ffffff",
                      "inverse-surface": "#362f2d",
                      "on-secondary-container": "#775b01",
                      "on-primary-fixed-variant": "#783200",
                      "surface-variant": "#ece0dc",
                      "on-secondary-fixed": "#251a00",
                      "surface-container-highest": "#ece0dc",
                      "on-secondary-fixed-variant": "#5a4400",

                      "on-background": "#201a18",
                      "on-surface-variant": "#564339",
                      "tertiary-fixed": "#ffd9e3",

                      "on-primary-fixed": "#341100",
                      "surface-tint": "#9d4300",
                      "secondary-fixed": "#ffdf96",
                      "on-tertiary-fixed-variant": "#633b48",
                      "on-primary": "#ffffff",
                      "primary-fixed": "#ffdbca",
                      "surface-dim": "#e4d7d4",
                      "secondary-fixed-dim": "#e8c266",
                      "error": "#ba1a1a",
                      "primary": "#783100"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "md": "16px",
                      "xl": "32px",
                      "sidebar_width": "260px",
                      "gutter": "1px",
                      "sm": "8px",
                      "base": "4px",
                      "xs": "4px",
                      "lg": "24px"
              },
              "fontFamily": {
                      "title-md": [
                              "Inter"
                      ],
                      "code-body": [
                              "JetBrains Mono"
                      ],
                      "label-sm": [
                              "Inter"
                      ],
                      "headline-sm": [
                              "Inter"
                      ],
                      "display-lg": [
                              "Inter"
                      ],
                      "body-md": [
                              "Inter"
                      ],
                      "code-table": [
                              "JetBrains Mono"
                      ]
              },
              "fontSize": {
                      "title-md": [
                              "16px",

                                      "lineHeight": "24px",

                      ],
                      "code-body": [

                      "label-sm": [

                      "display-lg": [

                      "body-md": [
                              "14px",
                              {

                                      "fontWeight": "400"

                      ],
                      "code-table": [
                              "12px",
                              {
                                      "lineHeight": "18px",
                                      "fontWeight": "400"

                      ]
              }
      },
          },
        }

</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pb-16">
<!-- Top App Bar for Settings -->
<header class="flex items-center px-md h-[56px] bg-surface/80 backdrop-blur-md sticky top-0 z-50">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-on-surface/[0.08] active:scale-[0.97] duration-150 mr-2">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold flex-1">Appearance</h1>
</header>
<main class="flex-1 px-md py-lg space-y-xl max-w-2xl mx-auto w-full">
<!-- Theme Selection -->
<section class="space-y-md">
<h2 class="font-title-md text-title-md text-on-surface-variant">Theme</h2>
<div class="grid grid-cols-1 gap-md">
<!-- Light Theme Option (Selected) -->
<button class="relative w-full rounded-xl overflow-hidden border-2 border-primary active:scale-[0.97] transition-transform duration-150 bg-surface-container-low focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2">
<div class="absolute top-sm right-sm w-6 h-6 bg-primary rounded-full flex items-center justify-center z-10 shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="h-32 bg-[#F8FAFC] p-4 flex flex-col gap-2 pointer-events-none">
<!-- Simplified UI Preview -->
<div class="w-full h-8 bg-white rounded shadow-sm border border-[#E2E8F0] flex items-center px-2 gap-2">
<div class="w-4 h-4 rounded-full bg-[#E2E8F0]"></div>
<div class="w-20 h-2 bg-[#E2E8F0] rounded"></div>
</div>
<div class="flex-1 flex gap-2">
<div class="w-1/3 h-full bg-white rounded shadow-sm border border-[#E2E8F0] p-2 flex flex-col gap-2">
<div class="w-full h-2 bg-[#F1F5F9] rounded"></div>
<div class="w-3/4 h-2 bg-[#F1F5F9] rounded"></div>
</div>
<div class="w-2/3 h-full bg-white rounded shadow-sm border border-[#E2E8F0] p-2 flex flex-col gap-1">
<div class="w-1/2 h-2 bg-[#9D4300]/20 rounded"></div>
<div class="w-3/4 h-2 bg-[#F1F5F9] rounded"></div>
<div class="w-full h-2 bg-[#F1F5F9] rounded"></div>
</div>
</div>
</div>
<div class="py-3 px-4 bg-surface flex items-center justify-between border-t border-outline-variant">
<span class="font-title-md text-title-md">Light</span>
</div>
</button>
<!-- Dark Theme Option -->
<button class="relative w-full rounded-xl overflow-hidden border border-outline-variant active:scale-[0.97] transition-transform duration-150 hover:bg-on-surface/[0.04] bg-surface-container-low focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2">
<div class="h-32 bg-[#0F172A] p-4 flex flex-col gap-2 pointer-events-none">
<!-- Simplified UI Preview -->
<div class="w-full h-8 bg-[#1E293B] rounded shadow-sm border border-[#334155] flex items-center px-2 gap-2">
<div class="w-4 h-4 rounded-full bg-[#334155]"></div>
<div class="w-20 h-2 bg-[#334155] rounded"></div>
</div>
<div class="flex-1 flex gap-2">
<div class="w-1/3 h-full bg-[#1E293B] rounded shadow-sm border border-[#334155] p-2 flex flex-col gap-2">
<div class="w-full h-2 bg-[#0F172A] rounded"></div>
<div class="w-3/4 h-2 bg-[#0F172A] rounded"></div>
</div>
<div class="w-2/3 h-full bg-[#1E293B] rounded shadow-sm border border-[#334155] p-2 flex flex-col gap-1">
<div class="w-1/2 h-2 bg-[#FFB690]/20 rounded"></div>
<div class="w-3/4 h-2 bg-[#0F172A] rounded"></div>
<div class="w-full h-2 bg-[#0F172A] rounded"></div>
</div>
</div>
</div>
<div class="py-3 px-4 bg-surface flex items-center justify-between border-t border-outline-variant">
<span class="font-title-md text-title-md">Dark</span>
</div>
</button>
</div>
</section>
<!-- Editor Font Size -->
<section class="space-y-md">
<div class="flex items-center justify-between">
<h2 class="font-title-md text-title-md text-on-surface-variant">Editor Font Size</h2>
<span class="font-label-sm text-label-sm bg-surface-container-high px-2 py-1 rounded-md">14px</span>
</div>
<div class="p-4 bg-surface-container rounded-xl border border-outline-variant space-y-md">
<!-- Preview area -->
<div class="bg-surface p-4 rounded-lg border border-outline-variant overflow-x-auto">
<pre class="font-code-body text-code-body text-on-surface"><span class="text-primary">function</span> <span class="text-secondary">initializeEditor</span>() {
  <span class="text-on-surface-variant">// Setup the main canvas</span>
  <span class="text-primary">const</span> config = <span class="text-tertiary">loadConfig</span>();
}</pre>
</div>
<!-- Slider -->
<div class="flex items-center gap-sm pt-2">
<span class="font-code-body text-code-body text-on-surface-variant text-[12px]">A</span>
<input class="flex-1 h-2 bg-surface-variant rounded-lg appearance-none cursor-pointer accent-primary" max="24" min="10" type="range" value="14"/>
<span class="font-code-body text-code-body text-on-surface-variant text-[18px]">A</span>
</div>
</div>
</section>
<!-- Syntax Highlighting Toggle (Example addition) -->
<section class="flex items-center justify-between p-4 bg-surface-container rounded-xl border border-outline-variant">
<div class="flex flex-col gap-1">
<span class="font-title-md text-title-md">Ligatures</span>
<span class="font-body-md text-body-md text-on-surface-variant text-sm">Enable font ligatures in editor</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</section>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="bg-surface dark:bg-surface-container fixed bottom-0 left-0 w-full flex justify-around items-center h-16 md:hidden px-4 z-50">
<!-- Inactive items -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-on-surface/[0.04] active:scale-[0.97] duration-150 w-16 h-full rounded-lg" href="#">
<span class="material-symbols-outlined mb-1">description</span>
<span class="font-label-sm text-label-sm">Files</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-on-surface/[0.04] active:scale-[0.97] duration-150 w-16 h-full rounded-lg" href="#">
<span class="material-symbols-outlined mb-1">code</span>
<span class="font-label-sm text-label-sm">Editor</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-on-surface/[0.04] active:scale-[0.97] duration-150 w-16 h-full rounded-lg" href="#">
<span class="material-symbols-outlined mb-1">terminal</span>
<span class="font-label-sm text-label-sm">Terminal</span>
</a>
<!-- Active item -->
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-full px-4 py-1 hover:bg-on-surface/[0.04] active:scale-[0.97] duration-150 h-12 mt-2" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</a>
</nav>
</body></html>
