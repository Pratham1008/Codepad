server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/event-stream


spring:
  application:
    name: api-service
  threads:
    virtual:
      enabled: true
  cache:
    type: redis
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      leak-detection-threshold: 10000
      pool-name: api-hikari
  flyway:
    enabled: true
    baseline-on-migrate: true
    placeholder-replacement: false
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false


app:
  worker:
    url: ${WORKER_URL:http://localhost:8081}
    ws-url: ${WORKER_WS_URL:ws://localhost:8081}
  internal:
    secret: ${INTERNAL_SECRET}


springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    root: WARN
    org.springframework.web: INFO
    com.codepad.apiservice: INFO
    org.flywaydb: DEBUG
