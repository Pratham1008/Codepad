server:
  port: 8081

spring:
  application:
    name: worker-service
  threads:
    virtual:
      enabled: true

app:
  worker:
    ws-url: ${WORKER_WS_URL:ws://localhost:8081}
  monolith:
    url: ${API_SERVICE_URL:http://localhost:8080}
  internal:
    secret: ${INTERNAL_SECRET:change-me-in-production}
  judge:
    pool-size: ${POOL_SIZE:5}
  projects:
    root: ${PROJECTS_ROOT:/data/projects}

logging:
  level:
    org.springframework.web: INFO
    com.codepad.workerservice: DEBUG
